{% if discord_threads %}
<div class="discord-threads">
    <span class="pt-label">Discord thread{{ discord_threads|length|pluralize }}</span>
    {% for th in discord_threads %}<a href="{{ th.url }}" target="_blank" rel="noopener">{{ th.title|default:"Open thread in Discord" }}&nbsp;&#8599;</a>{% endfor %}
</div>
{% endif %}
